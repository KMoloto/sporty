<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Via Sport JBM FC matchday checklist — single file, no dependencies. Open in any browser. -->
<title>Via Sport JBM FC · Matchday Checklist</title>
<style>
:root{--red:#b5010d;--bg:#f6f4f3;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--ln:#e4dfdd;--ok:#1c8a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141010;--card:#201a1a;--tx:#f2eeee;--mut:#a89f9f;--ln:#372e2e;--ok:#4cc27c}}
:root[data-theme="dark"]{--bg:#141010;--card:#201a1a;--tx:#f2eeee;--mut:#a89f9f;--ln:#372e2e;--ok:#4cc27c}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light dark}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:var(--red);color:#fff;padding:16px;display:flex;gap:12px;align-items:center}
header img{width:56px;height:56px;border-radius:12px;background:#fff}
header h1{font-size:18px;margin:0;line-height:1.2}header p{margin:2px 0 0;font-size:13px;opacity:.9}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px}
nav button.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:720px;margin:0 auto;padding:12px}
section{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:12px;overflow:hidden}
section h2{margin:0;padding:12px 14px 8px;font-size:15px;color:var(--red);display:flex;justify-content:space-between;gap:8px}
section h2 span{color:var(--mut);font-weight:400;font-size:13px}
section .bar{margin:0 14px 6px}
label.it{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--ln);cursor:pointer}
label.it input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
label.it.d .t{text-decoration:line-through;color:var(--mut)}label.it small{display:block;color:var(--mut);font-size:12px}
.f{padding:10px 14px;border-top:1px solid var(--ln)}.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.f input,.f textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
.f textarea{min-height:64px;resize:vertical}
.tools{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding:4px 2px 12px}
.tools button{border:1px solid var(--red);color:var(--red);background:transparent;border-radius:8px;padding:6px 12px;font:inherit}
.note{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:12px}
</style></head><body>

async function toggle(k,done){
  ticks[k]={done,by:uid};save();render();

  try{await db.doc('ticks/'+k).set({done,by:uid,at:Date.now()})}catch(e){}
}
async function reset(){

  mine.forEach(k=>delete ticks[k]);save();render();
  if(db)for(const k of mine){try{await db.doc('ticks/'+k).delete()}catch(e){}}
}
function buildNotes(){

  $('#notes').querySelectorAll('[data-f]').forEach(el=>{el.disabled=!canWrite;el.onchange=async()=>{notes[el.dataset.f]=el.value;save();if(db){try{await db.doc('notes/'+el.dataset.f).set({v:el.value})}catch(e){}}}});
}
function fillNotes(){$('#notes').querySelectorAll('[data-f]').forEach(el=>{if(document.activeElement!==el)el.value=(notes[el.dataset.f]||'')})}
async function resolveNames(){

}

    team=t;try{localStorage.setItem('vs-team',t)}catch(e){}
    const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
    const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
    const fs=F.getFirestore(A.initializeApp(FIREBASE_CONFIG));
    const P=p=>F.doc(fs,'teams',team,...p.split('/'));
    db={doc:p=>({set:d=>F.setDoc(P(p),d),delete:()=>F.deleteDoc(P(p))}),
        collection:c=>({onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,'teams',team,c),q=>n({docs:q.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)})};
    db.collection('ticks').onSnapshot(q=>{ticks={};q.docs.forEach(d=>{ticks[d.id]=d.data()});render()},()=>{});
    db.collection('notes').onSnapshot(q=>{notes={};q.docs.forEach(d=>{notes[d.id]=(d.data()||{}).v});fillNotes()},()=>{});
    render();
  }catch(e){db=null;render()}
})();
</script></body></html>
